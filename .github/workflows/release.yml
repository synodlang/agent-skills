name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the plugin version
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(grep -m1 '"version"' .claude-plugin/plugin.json | sed -E 's/.*"version": *"([^"]*)".*/\1/')"
          if [ "$got" != "$want" ]; then
            echo "::error::plugin.json version is $got, but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Release notes
        run: go run ./tools/sync -notes "${GITHUB_REF_NAME}" > notes.md
      - name: Package
        run: |
          name="agent-skills-${GITHUB_REF_NAME}"
          mkdir -p "dist/${name}"
          cp -R .claude-plugin skills AGENTS.md README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -r "dist/${name}"
          (cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --notes-file notes.md "${flags[@]}"
